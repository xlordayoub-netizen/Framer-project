name: Deploy to GitHub Pages

# Mirrors this branch to gh-pages, which GitHub Pages serves
# (Settings -> Pages -> Deploy from branch: gh-pages).
# The Pages REST API is not accessible to the Actions token in this
# repo, so branch-based deployment is used instead of deploy-pages.

on:
  push:
    branches: [claude/global-skill-install-tquoq1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror branch to gh-pages
        run: git push --force origin HEAD:gh-pages
